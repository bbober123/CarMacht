<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CarMatch - Log in</title>
<link rel="stylesheet" href="style.css?v=20260726c">
<link rel="stylesheet" href="pages.css?v=20260726c">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body class="page-body">

  <div class="page-wrap narrow">
    <a href="index.html" class="back-link" data-i18n="common.back">← Back</a>
    <div class="auth-card">
      <img id="auth-logo" src="logo-dark.png" alt="CarMatch" class="auth-logo site-logo">
      <h1 class="font-display">CarMatch</h1>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" data-i18n="auth.login_tab">Log in</button>
        <button class="auth-tab" data-tab="register" data-i18n="auth.register_tab">Sign up</button>
      </div>

      <button id="google-btn" class="btn-secondary full-width google-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71A5.4 5.4 0 013.68 9c0-.59.1-1.17.29-1.71V4.95H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.05l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        <span data-i18n="auth.google_btn">Continue with Google</span>
      </button>

      <div class="auth-divider"><span data-i18n="auth.or_divider">or</span></div>

      <form id="login-form" class="auth-form">
        <input type="email" name="email" data-i18n-placeholder="auth.email_ph" placeholder="Email" required autocomplete="username">
        <input type="password" name="password" data-i18n-placeholder="auth.password_ph" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="btn-primary full-width" data-i18n="auth.login_submit">Log in</button>
      </form>

      <form id="register-form" class="auth-form" style="display:none;">
        <input type="text" name="displayName" data-i18n-placeholder="auth.name_ph" placeholder="What should we call you?" required>
        <input type="email" name="email" data-i18n-placeholder="auth.email_ph" placeholder="Email" required autocomplete="username">
        <input type="password" name="password" data-i18n-placeholder="auth.password_min_ph" placeholder="Password (min. 6 characters)" required minlength="6" autocomplete="new-password">
        <button type="submit" class="btn-primary full-width" data-i18n="auth.register_submit">Create account</button>
      </form>

      <p id="auth-status" class="status-text"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260726c"></script>
  <script src="supabase-client.js?v=20260726c"></script>
  <script src="i18n.js?v=20260726c"></script>
  <script src="appearance.js?v=20260726c"></script>
  <script src="site-settings.js?v=20260726c"></script>
  <script src="settings-panel.js?v=20260726c"></script>
  <script src="auth.js?v=20260726c"></script>
</body>
</html>
