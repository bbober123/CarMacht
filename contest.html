<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CarMatch - Contest</title>
<link rel="stylesheet" href="style.css?v=20260726c">
<link rel="stylesheet" href="pages.css?v=20260726c">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body class="page-body">

  <div class="page-wrap">
    <a href="index.html" class="back-link" data-i18n="common.back_discover">← Back to discovering</a>
    <div class="page-header">
      <h1 data-i18n="contest.title">Car of the week</h1>
      <button id="add-entry-btn" class="btn-primary" data-i18n="contest.add_entry_btn">Submit your car</button>
    </div>

    <div class="card">
      <div class="slots-bar">
        <div class="slots-track"><div id="slots-fill" class="slots-fill" style="width:0%;"></div></div>
        <span id="slots-label" class="slots-label">0 / 30</span>
      </div>
      <p class="empty-msg" id="full-notice" style="display:none; padding:0; text-align:left; color:var(--nope, #D6543F);" data-i18n="contest.full_notice">
        All spots for this week are taken. Wait for the admin to free one up, or for a new week to start.
      </p>
    </div>

    <h2 class="font-display" style="color:var(--text); font-size:16px; margin: 22px 0 12px;" data-i18n="contest.previous_winners">🏆 Previous winners</h2>
    <div id="winners-grid" class="contest-grid" style="margin-bottom: 30px;"></div>

    <h2 class="font-display" style="color:var(--text); font-size:16px; margin: 0 0 12px;" data-i18n="contest.entries_this_week">This week's entries</h2>
    <div id="entries-grid" class="contest-grid"></div>
  </div>

  <!-- MODAL ZGŁOSZENIA -->
  <div id="entry-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h2 data-i18n="contest.entry_modal_title">Submit your car</h2>
        <button class="modal-close" data-close="entry-modal">✕</button>
      </div>
      <form id="entry-form">
        <input name="make" data-i18n-placeholder="modal.make_ph" placeholder="Make *" required>
        <input name="model" data-i18n-placeholder="modal.model_ph" placeholder="Model *" required>
        <input name="year" type="number" data-i18n-placeholder="modal.year_ph" placeholder="Year">
        <textarea name="description" data-i18n-placeholder="contest.description_ph" placeholder="A few words about this car..."></textarea>
        <input name="file" type="file" accept="image/*" required>
        <button type="submit" class="btn-primary full-width" data-i18n="contest.submit_entry">Submit entry</button>
        <p class="modal-status"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260726c"></script>
  <script src="supabase-client.js?v=20260726c"></script>
  <script src="i18n.js?v=20260726c"></script>
  <script src="appearance.js?v=20260726c"></script>
  <script src="site-settings.js?v=20260726c"></script>
  <script src="settings-panel.js?v=20260726c"></script>
  <script src="contest.js?v=20260726c"></script>
</body>
</html>
